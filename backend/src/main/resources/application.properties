spring.application.name=Football-League-API

# Define o profile padrão como "dev"
spring.profiles.active=dev

spring.docker.compose.enabled=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Datasource - Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.qbkwshtggnzeeejaapqv.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Football API Configuration
football.api.key=${FOOTBALL_API_KEY:}
football.api.enabled=true
football.api.timeout.ms=10000
football.api.max-retries=3
football.api.rate-limit.requests=100

# Football API Sync Configuration
# football.api.sync.on-startup=true
football.api.sync.on-startup=false
football.api.sync.interval-hours=24
football.api.sync.scheduled=true
# IDs das ligas (API-Football) cujos times serão sincronizados, separados por vírgula
football.api.sync.league-ids=71
# Faixa de temporadas liberada pelo plano da API (Free: 2022 a 2024). Temporadas fora dela são ignoradas.
football.api.sync.min-season=2022
football.api.sync.max-season=2024

# Autenticacao e autorizacao
app.admin.nome=${ADMIN_NOME:Admin}
app.admin.email=${ADMIN_EMAIL:admin@footballleague.com}
app.admin.senha=${ADMIN_PASSWORD:admin123}
jwt.secret=${JWT_SECRET:football-league-api-dev-secret-change-me-123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.Football_League_API.external=DEBUG
