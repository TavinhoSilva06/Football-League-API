spring.application.name=Football-League-API

# Define o profile padrão como "dev"
spring.profiles.active=dev

spring.docker.compose.enabled=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



# Datasource - Supabase PostgreSQL
spring.datasource.url=jdbc:postgresql://db.qbkwshtggnzeeejaapqv.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Football API Configuration
football.api.key=${FOOTBALL_API_KEY:}
football.api.enabled=true
football.api.timeout.ms=10000
football.api.max-retries=3
football.api.rate-limit.requests=100

# Football API Sync Configuration
football.api.sync.on-startup=true
football.api.sync.interval-hours=24
football.api.sync.scheduled=true
# IDs das ligas (API-Football) cujos times serão sincronizados, separados por vírgula
football.api.sync.league-ids=71
# Temporada usada para sincronizar os times (plano Free: 2022 a 2024)
football.api.sync.team-season=2024

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.Football_League_API.external=DEBUG
